<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>輔助溝通板 (AAC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 防止長按選取文字影響觸控體驗 */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-black min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-4xl bg-white border-[2.5px] border-black rounded-3xl p-3 sm:p-5 shadow-sm flex flex-col gap-3">
    
    <!-- 頂端資訊列 -->
    <div class="flex items-center justify-between px-2 text-sm sm:text-base font-bold">
      <div id="pageIndicator" class="px-3 py-1 border-[2px] border-black rounded-full bg-white">
        第 4 / 7 頁
      </div>
      <div id="modeBadge" class="px-3 py-1 border-[2px] border-black rounded-full bg-white text-black transition-colors">
        輸入模式
      </div>
      <!-- 電腦輔助切換按鈕（若無多點觸控螢幕可用） -->
      <button id="toggleEditBtn" class="text-xs sm:text-sm underline cursor-pointer hover:opacity-70">
        電腦點擊切換編輯
      </button>
    </div>

    <!-- 6x4 核心方格佈局 -->
    <div class="grid grid-cols-4 grid-rows-6 gap-2 sm:gap-3 h-[78vh] sm:h-[82vh] w-full">
      
      <!-- 第一排：合併為跨 4 格的大型輸出區 (Row 1, Col 1~4) -->
      <div class="col-span-4 row-span-1 border-[2.5px] border-black rounded-2xl p-3 flex items-center justify-between bg-white overflow-hidden">
        <div id="displayArea" class="text-2xl sm:text-4xl md:text-5xl font-extrabold tracking-wide overflow-x-auto whitespace-nowrap scrollbar-none flex-1 text-black">
          <!-- 動態輸入文字 -->
        </div>
        <div class="w-2 h-7 sm:h-9 bg-black animate-pulse ml-2 flex-shrink-0"></div>
      </div>

      <!-- 第二排：功能控制鍵 (Row 2, Col 1~4) -->
      <!-- 上一頁 -->
      <button id="prevBtn" class="border-[2.5px] border-black rounded-2xl flex flex-col items-center justify-center font-black active:bg-black active:text-white transition-all text-base sm:text-2xl">
        <span>◀</span>
        <span class="text-xs sm:text-sm mt-0.5">上一頁</span>
      </button>

      <!-- 刪除單字 -->
      <button id="delCharBtn" class="border-[2.5px] border-black rounded-2xl flex flex-col items-center justify-center font-black active:bg-black active:text-white transition-all text-base sm:text-2xl">
        <span>⌫</span>
        <span class="text-xs sm:text-sm mt-0.5">刪除單字</span>
      </button>

      <!-- 刪除整句 -->
      <button id="clearBtn" class="border-[2.5px] border-black rounded-2xl flex flex-col items-center justify-center font-black active:bg-black active:text-white transition-all text-base sm:text-2xl">
        <span>🗑</span>
        <span class="text-xs sm:text-sm mt-0.5">刪除整句</span>
      </button>

      <!-- 下一頁 -->
      <button id="nextBtn" class="border-[2.5px] border-black rounded-2xl flex flex-col items-center justify-center font-black active:bg-black active:text-white transition-all text-base sm:text-2xl">
        <span>▶</span>
        <span class="text-xs sm:text-sm mt-0.5">下一頁</span>
      </button>

      <!-- 第三排至第六排：4x4 共 16 格內容輸入鍵 (Row 3~6, Col 1~4) -->
      <div id="gridContainer" class="col-span-4 row-span-4 grid grid-cols-4 grid-rows-4 gap-2 sm:gap-3">
        <!-- 16 個按鈕由 JavaScript 動態生成渲染 -->
      </div>

    </div>

    <!-- 底部操作提示 -->
    <div class="text-center text-xs sm:text-sm font-medium text-gray-700">
      提示：同時按住「上一頁」與「下一頁」可切換編輯模式，點擊按鈕即可修改該格詞彙。
    </div>

  </div>

  <script>
    // 預設 7 頁詞庫資料 (第 3 頁與第 5 頁有詞彙，第 4 頁常態啟動為空白)
    const DEFAULT_PAGES = {
      1: Array(16).fill(''),
      2: Array(16).fill(''),
      3: [
        '我想', '要', '不要', '好',
        '要吃', '要喝', '去廁所', '痛',
        '累', '舒服', '不舒服', '高興',
        '生氣', '請幫忙', '謝謝', '等一下'
      ],
      4: Array(16).fill(''), // 常態預設第 4 頁
      5: [
        '早安', '晚安', '是', '不是',
        '請', '對不起', '沒關係', '在哪裡',
        '什麼', '誰', '多少', '這裡',
        '那裡', '現在', '等下', '回家'
      ],
      6: Array(16).fill(''),
      7: Array(16).fill('')
    };

    const TOTAL_PAGES = 7;
    let currentPage = 4; // 常態第 4 頁
    let isEditMode = false;

    // 從 localStorage 讀取或初始化
    let pagesData = JSON.parse(localStorage.getItem('aac_pages_data')) || DEFAULT_PAGES;
    let currentInput = localStorage.getItem('aac_current_input') || '';

    // DOM 元素快取
    const displayArea = document.getElementById('displayArea');
    const pageIndicator = document.getElementById('pageIndicator');
    const modeBadge = document.getElementById('modeBadge');
    const gridContainer = document.getElementById('gridContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const delCharBtn = document.getElementById('delCharBtn');
    const clearBtn = document.getElementById('clearBtn');
    const toggleEditBtn = document.getElementById('toggleEditBtn');

    // 儲存資料至 localStorage
    function saveData() {
      localStorage.setItem('aac_pages_data', JSON.stringify(pagesData));
      localStorage.setItem('aac_current_input', currentInput);
    }

    // 更新頂端文字顯示
    function updateDisplay() {
      displayArea.textContent = currentInput || '（請點選下方字詞）';
      displayArea.className = currentInput 
        ? "text-2xl sm:text-4xl md:text-5xl font-extrabold tracking-wide overflow-x-auto whitespace-nowrap scrollbar-none flex-1 text-black"
        : "text-2xl sm:text-4xl md:text-5xl font-extrabold tracking-wide overflow-x-auto whitespace-nowrap scrollbar-none flex-1 text-gray-300";
      displayArea.scrollLeft = displayArea.scrollWidth;
      saveData();
    }

    // 切換模式顯示
    function setEditMode(state) {
      isEditMode = state;
      if (isEditMode) {
        modeBadge.textContent = '✏️ 編輯模式中';
        modeBadge.className = 'px-3 py-1 border-[2px] border-black rounded-full bg-black text-white font-bold animate-bounce';
      } else {
        modeBadge.textContent = '輸入模式';
        modeBadge.className = 'px-3 py-1 border-[2px] border-black rounded-full bg-white text-black font-bold';
      }
      renderGrid();
    }

    // 渲染 4x4 共 16 格按鈕
    function renderGrid() {
      pageIndicator.textContent = `第 ${currentPage} / ${TOTAL_PAGES} 頁`;
      gridContainer.innerHTML = '';
      const items = pagesData[currentPage] || Array(16).fill('');

      items.forEach((text, index) => {
        const btn = document.createElement('button');
        btn.className = `border-[2.5px] border-black rounded-2xl flex items-center justify-center p-2 font-black transition-all active:scale-95 active:bg-black active:text-white ${
          isEditMode ? 'border-dashed bg-yellow-50' : 'bg-white'
        }`;

        const textSpan = document.createElement('span');
        textSpan.className = 'text-lg sm:text-2xl md:text-3xl leading-tight text-center break-words max-h-full overflow-hidden';
        textSpan.textContent = text || (isEditMode ? '＋' : '');
        btn.appendChild(textSpan);

        btn.addEventListener('click', () => {
          if (isEditMode) {
            const newText = prompt(`修改第 ${currentPage} 頁第 ${index + 1} 格內容：`, text);
            if (newText !== null) {
              pagesData[currentPage][index] = newText.trim();
              saveData();
              renderGrid();
            }
          } else {
            if (text) {
              currentInput += text;
              updateDisplay();
            }
          }
        });

        gridContainer.appendChild(btn);
      });
    }

    // 刪除鍵邏輯
    delCharBtn.addEventListener('click', () => {
      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
      }
    });

    clearBtn.addEventListener('click', () => {
      if (currentInput.length > 0) {
        currentInput = '';
        updateDisplay();
      }
    });

    // 翻頁邏輯
    function gotoPrev() {
      if (currentPage > 1) {
        currentPage--;
        renderGrid();
      }
    }

    function gotoNext() {
      if (currentPage < TOTAL_PAGES) {
        currentPage++;
        renderGrid();
      }
    }

    // 雙指 / 同時按下偵測邏輯
    let prevPressed = false;
    let nextPressed = false;

    function checkSimultaneousPress() {
      if (prevPressed && nextPressed) {
        setEditMode(!isEditMode);
        prevPressed = false;
        nextPressed = false;
      }
    }

    // 上一頁按鍵監聽
    prevBtn.addEventListener('pointerdown', () => {
      prevPressed = true;
      checkSimultaneousPress();
    });
    prevBtn.addEventListener('pointerup', () => {
      if (prevPressed && !nextPressed) gotoPrev();
      prevPressed = false;
    });
    prevBtn.addEventListener('pointerleave', () => { prevPressed = false; });

    // 下一頁按鍵監聽
    nextBtn.addEventListener('pointerdown', () => {
      nextPressed = true;
      checkSimultaneousPress();
    });
    nextBtn.addEventListener('pointerup', () => {
      if (nextPressed && !prevPressed) gotoNext();
      nextPressed = false;
    });
    nextBtn.addEventListener('pointerleave', () => { nextPressed = false; });

    // 滑鼠點擊切換輔助鍵
    toggleEditBtn.addEventListener('click', () => {
      setEditMode(!isEditMode);
    });

    // 初始載入
    updateDisplay();
    renderGrid();
  </script>
</body>
</html>
