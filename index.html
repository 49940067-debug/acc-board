<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>輔助溝通板 (AAC)</title>

  <!-- PWA 核心設定與圖示 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- iOS Safari 獨立全螢幕 App 支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AAC溝通板">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23fff'>🗣️</text></svg>">

  <style>
    /* 基礎重置與無障礙觸控防選取 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }

    /* 外層滿版容器 */
    .app-container {
      width: 100%;
      height: 100%;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    .board-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 3px solid #000000;
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 頂部狀態列 */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
    }
    .badge-group, .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-badge {
      padding: 2px 10px;
      border: 2.5px solid #000000;
      border-radius: 9999px;
      background: #ffffff;
      color: #000000;
    }
    .btn-switch {
      padding: 2px 10px;
      border: 2.5px solid #000000;
      border-radius: 9999px;
      background: #000000;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-edit-toggle {
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      background: none;
      border: none;
    }

    /* 主網格容器 */
    .grid-container {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* 四乘四版面（4 欄 × 6 列） */
    .layout-6x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }

    /* 九宮格版面（3 欄 × 5 列） */
    .layout-5x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }

    /* 欄位跨距 */
    .col-span-2 { grid-column: span 2; }
    .col-span-3 { grid-column: span 3; }
    .col-span-4 { grid-column: span 4; }
    .row-span-3 { grid-row: span 3; }
    .row-span-4 { grid-row: span 4; }

    /* 輸出顯示欄 */
    .display-box {
      border: 3px solid #000000;
      border-radius: 16px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      background: #ffffff;
      overflow: hidden;
    }
    .display-text {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow-x: auto;
      flex: 1;
      color: #000000;
      cursor: pointer;
    }
    .display-placeholder {
      color: #d1d5db;
    }

    /* 通用操作按鈕 */
    .aac-btn {
      border: 3px solid #000000;
      border-radius: 16px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: background-color 0.1s, transform 0.05s;
    }
    .aac-btn:active {
      background-color: #000000;
      color: #ffffff;
      transform: scale(0.98);
    }
    .btn-icon {
      font-size: 1.8rem;
      line-height: 1;
    }
    .btn-label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 2px;
    }

    /* 詞彙按鈕 */
    .word-btn {
      border: 3px solid #000000;
      border-radius: 16px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.1s, transform 0.05s;
    }
    .word-btn:active {
      background-color: #000000;
      color: #ffffff;
      transform: scale(0.97);
    }
    .word-btn.editing {
      border-style: dashed;
      background-color: #fefce8;
    }
    .word-text-large {
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      word-break: break-all;
    }
    .word-text-small {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      word-break: break-all;
    }

    /* 詞彙子網格 */
    .words-grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }
    .words-grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }

    /* 底部操作提示 */
    .footer-hint {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .display-text { font-size: 3.5rem; }
      .btn-icon { font-size: 2.2rem; }
      .btn-label { font-size: 1.1rem; }
      .word-text-large { font-size: 2.8rem; }
      .word-text-small { font-size: 1.6rem; }
      .header-bar { font-size: 16px; }
      .board-card { gap: 8px; padding: 10px; }
      .layout-6x4, .layout-5x3, .words-grid-4x4, .words-grid-3x3 { gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="board-card">
      
      <!-- 頂部資訊與切換列 -->
      <div class="header-bar">
        <div class="badge-group">
          <div id="pageIndicator" class="pill-badge">第 6 / 11 頁</div>
          <button id="layoutSwitchBtn" class="btn-switch">切換為九宮格</button>
        </div>
        <div class="action-group">
          <div id="modeBadge" class="pill-badge">輸入模式</div>
          <button id="toggleEditBtn" class="btn-edit-toggle">連點切換編輯</button>
        </div>
      </div>

      <!-- 核心動態方格容器 -->
      <div id="mainGrid" class="grid-container"></div>

      <!-- 底部操作提示 -->
      <div class="footer-hint">
        提示：點擊「🔊 朗讀」唸出整句｜同時按住上一頁與下一頁切換編輯模式
      </div>

    </div>
  </div>

  <script>
    // 四乘四版：11 頁詞庫（啟動頁第 6 頁）
    const DEFAULT_6X4 = {
      1: Array(16).fill(''),
      2: Array(16).fill(''),
      3: [
        '頭痛', '肚子痛', '胸口痛', '腳痛',
        '手痛', '背痛', '很癢', '頭暈',
        '想吐', '抽筋', '呼吸不順', '發燒',
        '生氣', '難過', '害怕', '安心'
      ],
      4: [
        '要吃', '要喝', '去廁所', '要洗澡',
        '想睡覺', '要起床', '坐下', '躺下',
        '口渴', '肚子餓', '吃藥', '換衣服',
        '太冷了', '太熱了', '這裡痛', '想回家'
      ],
      5: [
        '我想', '要', '不要', '好',
        '不好', '請幫我', '謝謝', '對不起',
        '痛', '累', '舒服', '不舒服',
        '冷', '熱', '等一下', '請慢點'
      ],
      6: Array(16).fill(''), // 第 6 頁中心啟動空白頁
      7: [
        '是', '不是', '早安', '晚安',
        '請', '沒關係', '對', '不對',
        '在哪裡', '什麼', '誰', '這裡',
        '那裡', '現在', '等下', '沒問題'
      ],
      8: [
        '請開燈', '請關燈', '太吵了', '請小聲點',
        '我想看電視', '聽音樂', '我想休息', '請扶我',
        '請陪我', '不要走', '想聊聊天', '出門',
        '刷牙', '洗臉', '吃飽了', '不知道'
      ],
      9: [
        '很高興', '辛苦了', '很棒', '真好吃',
        '很喜歡', '不喜歡', '不用了', '我同意',
        '沒事的', '慢慢來', '明天見', '祝好運',
        '一路平安', '多保重', '再見', '再說一次'
      ],
      10: Array(16).fill(''),
      11: Array(16).fill('')
    };

    // 九宮格版：15 頁詞庫（啟動頁第 8 頁）
    const DEFAULT_5X3 = {
      1: Array(9).fill(''),
      2: Array(9).fill(''),
      3: [
        '擦嘴巴', '換姿勢', '蓋被子',
        '拿枕頭', '要吸痰', '拍拍背',
        '要洗澡', '很酸', '抽筋'
      ],
      4: [
        '生氣', '難過', '害怕',
        '安心', '很煩', '緊張',
        '放輕鬆', '好多了', '無聊'
      ],
      5: [
        '頭痛', '肚子痛', '想吐',
        '很癢', '頭暈', '發燒',
        '呼吸不順', '胸口痛', '很脹'
      ],
      6: [
        '要吃', '要喝', '去廁所',
        '想睡覺', '要坐下', '要躺下',
        '吃藥', '太冷了', '太熱了'
      ],
      7: [
        '我想', '要', '不要',
        '好', '請幫我', '謝謝',
        '痛', '累', '不舒服'
      ],
      8: Array(9).fill(''), // 第 8 頁中心啟動空白頁
      9: [
        '是', '不是', '早安',
        '晚安', '請', '沒關係',
        '對', '不知道', '等一下'
      ],
      10: [
        '請開燈', '請關燈', '太吵了',
        '我想休息', '請扶我', '不要走',
        '想看電視', '想喝水', '沒問題'
      ],
      11: [
        '很高興', '辛苦了', '很棒',
        '真好吃', '很喜歡', '不用了',
        '沒事的', '慢慢來', '再見'
      ],
      12: [
        '在哪裡', '誰來了', '什麼時候',
        '想出門', '回家', '換衣服',
        '刷牙', '洗臉', '吃飽了'
      ],
      13: [
        '我同意', '不同意', '都可以',
        '都可以啦', '再想想', '等等我',
        '我明白', '不知道', '沒意見'
      ],
      14: Array(9).fill(''),
      15: Array(9).fill('')
    };

    let currentLayout = localStorage.getItem('aac_layout_mode_v16') || '6x4';
    let currentPage = currentLayout === '5x3' ? 8 : 6;
    let isEditMode = false;

    let data6x4 = JSON.parse(localStorage.getItem('aac_data_6x4_v16')) || DEFAULT_6X4;
    let data5x3 = JSON.parse(localStorage.getItem('aac_data_5x3_v16')) || DEFAULT_5X3;
    let currentInput = localStorage.getItem('aac_current_input') || '';

    const pageIndicator = document.getElementById('pageIndicator');
    const layoutSwitchBtn = document.getElementById('layoutSwitchBtn');
    const modeBadge = document.getElementById('modeBadge');
    const toggleEditBtn = document.getElementById('toggleEditBtn');
    const mainGrid = document.getElementById('mainGrid');

    // ==========================================
    // 螢幕常亮控制（Screen Wake Lock API）
    // ==========================================
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
          });
        }
      } catch (err) {
        // 瀏覽器未授權或後台運行
      }
    }

    // 當分頁重新回到前景時，自動重新取得鎖定
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    // 初次點擊或觸控任何位置時立即啟用鎖定
    ['click', 'touchstart', 'pointerdown'].forEach((evt) => {
      document.addEventListener(evt, () => {
        if (!wakeLock) {
          requestWakeLock();
        }
      }, { once: false });
    });

    requestWakeLock();

    function getTotalPages() {
      return currentLayout === '5x3' ? 15 : 11;
    }

    function saveCurrentData() {
      if (currentLayout === '6x4') {
        localStorage.setItem('aac_data_6x4_v16', JSON.stringify(data6x4));
      } else {
        localStorage.setItem('aac_data_5x3_v16', JSON.stringify(data5x3));
      }
      localStorage.setItem('aac_current_input', currentInput);
      localStorage.setItem('aac_layout_mode_v16', currentLayout);
    }

    // 瀏覽器原生語音朗讀
    function speakText(text) {
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW'));
      if (twVoice) utterance.voice = twVoice;

      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    function updateDisplayElement(displayEl) {
      if (!displayEl) return;
      if (currentInput) {
        displayEl.textContent = currentInput;
        displayEl.className = 'display-text';
      } else {
        displayEl.textContent = '（請點選下方字詞）';
        displayEl.className = 'display-text display-placeholder';
      }
      displayEl.scrollLeft = displayEl.scrollWidth;
      saveCurrentData();
    }

    function setEditMode(state) {
      isEditMode = state;
      if (isEditMode) {
        modeBadge.textContent = '✏️ 編輯模式中';
        modeBadge.style.background = '#000000';
        modeBadge.style.color = '#ffffff';
      } else {
        modeBadge.textContent = '輸入模式';
        modeBadge.style.background = '#ffffff';
        modeBadge.style.color = '#000000';
      }
      renderBoard();
    }

    function renderBoard() {
      const total = getTotalPages();
      pageIndicator.textContent = `第 ${currentPage} / ${total} 頁`;
      layoutSwitchBtn.textContent = currentLayout === '6x4' ? '切換為九宮格' : '切換為四乘四';
      mainGrid.innerHTML = '';

      if (currentLayout === '6x4') {
        render6x4Layout();
      } else {
        render5x3Layout();
      }
    }

    // 渲染四乘四
    function render6x4Layout() {
      const container = document.createElement('div');
      container.className = 'layout-6x4';

      const dispArea = document.createElement('div');
      dispArea.className = 'display-box col-span-3';
      const dispText = document.createElement('div');
      dispText.id = 'displayArea';
      dispText.title = '點擊朗讀整句';
      dispText.addEventListener('click', () => { if (currentInput) speakText(currentInput); });
      dispArea.appendChild(dispText);

      const speakBtn = createActionBtn('🔊', '朗讀', () => { if (currentInput) speakText(currentInput); });
      container.appendChild(dispArea);
      container.appendChild(speakBtn);

      const prevBtn = createNavBtn('◀', '上一頁');
      const delCharBtn = createActionBtn('⌫', '刪除單字', () => {
        if (currentInput.length > 0) {
          currentInput = currentInput.slice(0, -1);
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const clearBtn = createActionBtn('🗑', '刪除整句', () => {
        if (currentInput.length > 0) {
          currentInput = '';
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const nextBtn = createNavBtn('▶', '下一頁');

      container.appendChild(prevBtn);
      container.appendChild(delCharBtn);
      container.appendChild(clearBtn);
      container.appendChild(nextBtn);

      const gridItems = document.createElement('div');
      gridItems.className = 'col-span-4 row-span-4 words-grid-4x4';
      populateWordButtons(gridItems, data6x4[currentPage] || Array(16).fill(''), data6x4, false);
      container.appendChild(gridItems);

      mainGrid.appendChild(container);
      bindSimultaneousPress(prevBtn, nextBtn);
      updateDisplayElement(document.getElementById('displayArea'));
    }

    // 渲染九宮格
    function render5x3Layout() {
      const container = document.createElement('div');
      container.className = 'layout-5x3';

      const dispArea = document.createElement('div');
      dispArea.className = 'display-box col-span-2';
      const dispText = document.createElement('div');
      dispText.id = 'displayArea';
      dispText.title = '點擊朗讀整句';
      dispText.addEventListener('click', () => { if (currentInput) speakText(currentInput); });
      dispArea.appendChild(dispText);

      const speakBtn = createActionBtn('🔊', '朗讀', () => { if (currentInput) speakText(currentInput); });
      container.appendChild(dispArea);
      container.appendChild(speakBtn);

      const prevBtn = createNavBtn('◀', '上一頁');
      const clearBtn = createActionBtn('🗑', '刪除整句', () => {
        if (currentInput.length > 0) {
          currentInput = '';
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const nextBtn = createNavBtn('▶', '下一頁');

      container.appendChild(prevBtn);
      container.appendChild(clearBtn);
      container.appendChild(nextBtn);

      const gridItems = document.createElement('div');
      gridItems.className = 'col-span-3 row-span-3 words-grid-3x3';
      populateWordButtons(gridItems, data5x3[currentPage] || Array(9).fill(''), data5x3, true);
      container.appendChild(gridItems);

      mainGrid.appendChild(container);
      bindSimultaneousPress(prevBtn, nextBtn);
      updateDisplayElement(document.getElementById('displayArea'));
    }

    function createActionBtn(icon, label, onClick) {
      const btn = document.createElement('button');
      btn.className = 'aac-btn';
      btn.innerHTML = `<span class="btn-icon">${icon}</span><span class="btn-label">${label}</span>`;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function createNavBtn(icon, label) {
      const btn = document.createElement('button');
      btn.className = 'aac-btn';
      btn.innerHTML = `<span class="btn-icon">${icon}</span><span class="btn-label">${label}</span>`;
      return btn;
    }

    function populateWordButtons(container, items, targetDataset, isNineGrid = false) {
      items.forEach((text, index) => {
        const btn = document.createElement('button');
        btn.className = `word-btn ${isEditMode ? 'editing' : ''}`;

        const textSpan = document.createElement('span');
        const textLen = (text || '').length;

        if (isNineGrid) {
          textSpan.className = textLen > 4 ? 'word-text-small' : 'word-text-large';
        } else {
          textSpan.className = textLen > 4 ? 'word-text-small' : 'word-text-large';
        }

        textSpan.textContent = text || (isEditMode ? '＋' : '');
        btn.appendChild(textSpan);

        btn.addEventListener('click', () => {
          if (isEditMode) {
            const newText = prompt(`修改第 ${currentPage} 頁第 ${index + 1} 格內容：`, text);
            if (newText !== null) {
              targetDataset[currentPage][index] = newText.trim();
              saveCurrentData();
              renderBoard();
            }
          } else {
            if (text) {
              currentInput += text;
              updateDisplayElement(document.getElementById('displayArea'));
            }
          }
        });

        container.appendChild(btn);
      });
    }

    function bindSimultaneousPress(prevBtn, nextBtn) {
      let prevPressed = false;
      let nextPressed = false;

      function check() {
        if (prevPressed && nextPressed) {
          setEditMode(!isEditMode);
          prevPressed = false;
          nextPressed = false;
        }
      }

      prevBtn.addEventListener('pointerdown', () => { 
        prevPressed = true; 
        check(); 
      });
      prevBtn.addEventListener('pointerup', () => {
        if (prevPressed && !nextPressed) {
          if (currentPage > 1) { 
            currentPage--; 
            renderBoard(); 
          }
        }
        prevPressed = false;
      });
      prevBtn.addEventListener('pointerleave', () => { prevPressed = false; });

      nextBtn.addEventListener('pointerdown', () => { 
        nextPressed = true; 
        check(); 
      });
      nextBtn.addEventListener('pointerup', () => {
        const total = getTotalPages();
        if (nextPressed && !prevPressed) {
          if (currentPage < total) { 
            currentPage++; 
            renderBoard(); 
          }
        }
        nextPressed = false;
      });
      nextBtn.addEventListener('pointerleave', () => { nextPressed = false; });
    }

    layoutSwitchBtn.addEventListener('click', () => {
      currentLayout = (currentLayout === '6x4') ? '5x3' : '6x4';
      currentPage = (currentLayout === '5x3') ? 8 : 6;
      saveCurrentData();
      renderBoard();
    });

    let lastClickTime = 0;
    let clickTimeout = null;

    toggleEditBtn.addEventListener('click', () => {
      const now = new Date().getTime();
      const diff = now - lastClickTime;

      if (diff < 400 && diff > 0) {
        clearTimeout(clickTimeout);
        setEditMode(!isEditMode);
        toggleEditBtn.textContent = '連點切換編輯';
        lastClickTime = 0;
      } else {
        lastClickTime = now;
        toggleEditBtn.textContent = '再點一下切換！';
        clearTimeout(clickTimeout);
        clickTimeout = setTimeout(() => {
          toggleEditBtn.textContent = '連點切換編輯';
          lastClickTime = 0;
        }, 1200);
      }
    });

    // 註冊 PWA 離線 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker 註冊成功:', reg.scope))
          .catch((err) => console.error('PWA Service Worker 註冊失敗:', err));
      });
    }

    renderBoard();
  </script>
</body>
</html>
