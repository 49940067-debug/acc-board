<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>輔助溝通板 (AAC)</title>

  <!-- PWA 核心設定與圖示 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- iOS Safari 獨立全螢幕 App 支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AAC溝通板">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23fff'>🗣️</text></svg>">

  <style>
    :root {
      --aac-font-scale: 1.0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    input, textarea, select {
      -webkit-user-select: auto;
      user-select: auto;
    }

    /* 安全區域避讓（避免被 iPhone 聽筒/動態島或控制桿遮蔽） */
    .app-container {
      width: 100%;
      height: 100%;
      padding: 8px;
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(8px + env(safe-area-inset-left, 0px));
      padding-right: calc(8px + env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
    }
    .board-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 3px solid #000000;
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    /* 頂部資訊列：復原為標準比例尺寸與配置（頁碼在左、按鈕在右） */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
    }
    .badge-group, .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-badge {
      padding: 2px 10px;
      border: 2.5px solid #000000;
      border-radius: 9999px;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
    }
    .btn-switch {
      padding: 2px 10px;
      border: 2.5px solid #000000;
      border-radius: 9999px;
      background: #000000;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-edit-toggle {
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      background: none;
      border: none;
    }

    .grid-container {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* 四乘四版面網格 */
    .layout-6x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }

    /* 九宮格版面網格 */
    .layout-5x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }

    .col-span-2 { grid-column: span 2; }
    .col-span-3 { grid-column: span 3; }
    .col-span-4 { grid-column: span 4; }
    .row-span-3 { grid-row: span 3; }
    .row-span-4 { grid-row: span 4; }

    /* 輸出顯示欄 */
    .display-box {
      border: 3px solid #000000;
      border-radius: 16px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      background: #ffffff;
      overflow: hidden;
    }
    .display-text {
      font-size: calc(2.2rem * var(--aac-font-scale));
      font-weight: 900;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow-x: auto;
      flex: 1;
      color: #000000;
      cursor: pointer;
    }
    .display-placeholder {
      color: #d1d5db;
    }

    /* 操作按鈕 */
    .aac-btn {
      border: 3px solid #000000;
      border-radius: 16px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: background-color 0.1s, transform 0.05s;
    }
    .aac-btn:active {
      background-color: #000000;
      color: #ffffff;
      transform: scale(0.98);
    }
    .btn-icon {
      font-size: calc(1.8rem * var(--aac-font-scale));
      line-height: 1;
    }
    .btn-label {
      font-size: calc(0.85rem * var(--aac-font-scale));
      font-weight: bold;
      margin-top: 2px;
    }

    /* 詞彙按鈕 */
    .word-btn {
      border: 3px solid #000000;
      border-radius: 16px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.1s, transform 0.05s;
    }
    .word-btn:active {
      background-color: #000000;
      color: #ffffff;
      transform: scale(0.97);
    }
    .word-btn.editing {
      border-style: dashed;
      background-color: #fefce8;
    }
    .word-text-large {
      font-size: calc(2.1rem * var(--aac-font-scale));
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      word-break: break-all;
    }
    .word-text-small {
      font-size: calc(1.25rem * var(--aac-font-scale));
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      word-break: break-all;
    }

    .words-grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }
    .words-grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      height: 100%;
      width: 100%;
    }

    .footer-hint {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .display-text { font-size: calc(3.5rem * var(--aac-font-scale)); }
      .btn-icon { font-size: calc(2.2rem * var(--aac-font-scale)); }
      .btn-label { font-size: calc(1.1rem * var(--aac-font-scale)); }
      .word-text-large { font-size: calc(2.8rem * var(--aac-font-scale)); }
      .word-text-small { font-size: calc(1.6rem * var(--aac-font-scale)); }
      .header-bar { font-size: 16px; }
      .board-card { gap: 8px; padding: 10px; }
      .layout-6x4, .layout-5x3, .words-grid-4x4, .words-grid-3x3 { gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- 主溝通板滿版容器 -->
  <div id="boardContainer" class="app-container">
    <div class="board-card">
      
      <!-- 頂部資訊與切換列 -->
      <div class="header-bar">
        <div class="badge-group">
          <div id="pageIndicator" class="pill-badge">第 8 / 15 頁</div>
          <button id="layoutSwitchBtn" class="btn-switch">切換為四乘四</button>
        </div>
        <div class="action-group">
          <div id="modeBadge" class="pill-badge">輸入模式</div>
          <button id="toggleEditBtn" class="btn-edit-toggle">切換編輯</button>
        </div>
      </div>

      <!-- 核心動態方格容器 -->
      <div id="mainGrid" class="grid-container"></div>

      <!-- 底部操作提示 -->
      <div class="footer-hint">
        提示：點擊「🔊 朗讀」唸出整句｜點右上角「切換編輯」｜編輯模式下第 1 列可直接調整頁數與顯示比例
      </div>

    </div>
  </div>

  <script>
    // 預設四乘四版（11 頁詞庫，第 6 頁空白中樞）
    const DEFAULT_6X4 = {
      1: Array(16).fill(''),
      2: ['擦嘴巴', '換姿勢', '蓋被子', '拿枕頭', '要吸痰', '拍拍背', '按摩', '剪指甲', '擦身體', '漱口', '喝溫水', '喝果汁', '吃稀飯', '吃水果', '想吃肉', '要喝湯'],
      3: ['頭痛', '肚子痛', '胸口痛', '腳痛', '手痛', '背痛', '很癢', '頭暈', '想吐', '抽筋', '呼吸不順', '發燒', '生氣', '難過', '害怕', '安心'],
      4: ['要吃', '要喝', '去廁所', '要洗澡', '想睡覺', '要起床', '坐下', '躺下', '口渴', '肚子餓', '吃藥', '換衣服', '太冷了', '太熱了', '這裡痛', '想回家'],
      5: ['我想', '要', '不要', '好', '不好', '請幫我', '謝謝', '對不起', '痛', '累', '舒服', '不舒服', '冷', '熱', '等一下', '請慢點'],
      6: Array(16).fill(''),
      7: ['是', '不是', '早安', '晚安', '請', '沒關係', '對', '不對', '在哪裡', '什麼', '誰', '這裡', '那裡', '現在', '等下', '沒問題'],
      8: ['請開燈', '請關燈', '太吵了', '請小聲點', '我想看電視', '聽音樂', '我想休息', '請扶我', '請陪我', '不要走', '想聊聊天', '出門', '刷牙', '洗臉', '吃飽了', '不知道'],
      9: ['很高興', '辛苦了', '很棒', '真好吃', '很喜歡', '不喜歡', '不用了', '我同意', '沒事的', '慢慢來', '明天見', '祝好運', '一路平安', '多保重', '再見', '再說一次'],
      10: ['看手機', '開窗戶', '關窗戶', '吹電扇', '開冷氣', '關冷氣', '看外面', '想睡了', '不要吵', '不要動', '等等我', '再想想', '都可以', '沒意見', '我明白', '聽不懂'],
      11: Array(16).fill('')
    };

    // 預設九宮格版（15 頁詞庫，第 8 頁空白中樞）
    const DEFAULT_5X3 = {
      1: Array(9).fill(''),
      2: ['吃白飯', '喝溫水', '吃稀飯', '喝果汁', '吃水果', '想吃肉', '要喝湯', '吃飽了', '還想吃'],
      3: ['擦嘴巴', '換姿勢', '蓋被子', '拿枕頭', '要吸痰', '拍拍背', '要洗澡', '很酸', '抽筋'],
      4: ['生氣', '難過', '害怕', '安心', '很煩', '緊張', '放輕鬆', '好多了', '無聊'],
      5: ['頭痛', '肚子痛', '想吐', '很癢', '頭暈', '發燒', '呼吸不順', '胸口痛', '很脹'],
      6: ['要吃', '要喝', '去廁所', '想睡覺', '要坐下', '要躺下', '吃藥', '太冷了', '太熱了'],
      7: ['我想', '要', '不要', '好', '請幫我', '謝謝', '痛', '累', '不舒服'],
      8: Array(9).fill(''),
      9: ['是', '不是', '早安', '晚安', '請', '沒關係', '對', '不知道', '等一下'],
      10: ['請開燈', '請關燈', '太吵了', '我想休息', '請扶我', '不要走', '想看電視', '想喝水', '沒問題'],
      11: ['很高興', '辛苦了', '很棒', '真好吃', '很喜歡', '不用了', '沒事的', '慢慢來', '再見'],
      12: ['在哪裡', '誰來了', '什麼時候', '想出門', '回家', '換衣服', '刷牙', '洗臉', '吃飽了'],
      13: ['聽音樂', '聊聊天', '看手機', '多喝水', '請小聲', '請慢點', '聽不清', '再說一次', '明天見'],
      14: ['我同意', '不同意', '都可以', '都可以啦', '再想想', '等等我', '我明白', '不知道', '沒意見'],
      15: Array(9).fill('')
    };

    // ==========================================================
    // 本地資料自動向後相容繼承函式（保護編輯內容不被更新刷新）
    // ==========================================================
    function getStoredDataWithMigration(primaryKey, fallbackKeys, defaultData) {
      const current = localStorage.getItem(primaryKey);
      if (current) {
        try { return JSON.parse(current); } catch(e) {}
      }
      for (const oldKey of fallbackKeys) {
        const oldVal = localStorage.getItem(oldKey);
        if (oldVal) {
          try {
            const parsed = JSON.parse(oldVal);
            localStorage.setItem(primaryKey, oldVal);
            return parsed;
          } catch(e) {}
        }
      }
      return defaultData;
    }

    let adminConfig = getStoredDataWithMigration(
      'aac_admin_config_v21',
      ['aac_admin_config_v20', 'aac_admin_config_v19'],
      { totalPages5x3: 15, totalPages6x4: 11, fontScale: 1.0 }
    );

    // 套用全域字級縮放
    document.documentElement.style.setProperty('--aac-font-scale', adminConfig.fontScale || 1.0);

    let currentLayout = localStorage.getItem('aac_layout_mode_v21') || '5x3';
    let currentPage = currentLayout === '5x3' 
      ? Math.ceil(adminConfig.totalPages5x3 / 2) 
      : Math.ceil(adminConfig.totalPages6x4 / 2);
    let isEditMode = false;

    let data6x4 = getStoredDataWithMigration(
      'aac_data_6x4_v21',
      ['aac_data_6x4_v20', 'aac_data_6x4_v19', 'aac_data_6x4_v18'],
      DEFAULT_6X4
    );
    let data5x3 = getStoredDataWithMigration(
      'aac_data_5x3_v21',
      ['aac_data_5x3_v20', 'aac_data_5x3_v19', 'aac_data_5x3_v18'],
      DEFAULT_5X3
    );
    let currentInput = localStorage.getItem('aac_current_input') || '';

    // 自動補齊設定頁數陣列
    function ensurePagesCapacity() {
      for (let i = 1; i <= adminConfig.totalPages6x4; i++) {
        if (!data6x4[i]) data6x4[i] = Array(16).fill('');
      }
      for (let i = 1; i <= adminConfig.totalPages5x3; i++) {
        if (!data5x3[i]) data5x3[i] = Array(9).fill('');
      }
    }
    ensurePagesCapacity();

    const pageIndicator = document.getElementById('pageIndicator');
    const layoutSwitchBtn = document.getElementById('layoutSwitchBtn');
    const modeBadge = document.getElementById('modeBadge');
    const toggleEditBtn = document.getElementById('toggleEditBtn');
    const mainGrid = document.getElementById('mainGrid');

    // ==========================================
    // 螢幕防休眠常亮鎖定（Screen Wake Lock API）
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (err) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    ['click', 'touchstart', 'pointerdown'].forEach((evt) => {
      document.addEventListener(evt, () => { if (!wakeLock) requestWakeLock(); }, { once: false });
    });
    requestWakeLock();

    function getTotalPages() {
      return currentLayout === '5x3' ? adminConfig.totalPages5x3 : adminConfig.totalPages6x4;
    }

    function saveCurrentData() {
      if (currentLayout === '6x4') {
        localStorage.setItem('aac_data_6x4_v21', JSON.stringify(data6x4));
      } else {
        localStorage.setItem('aac_data_5x3_v21', JSON.stringify(data5x3));
      }
      localStorage.setItem('aac_current_input', currentInput);
      localStorage.setItem('aac_layout_mode_v21', currentLayout);
      localStorage.setItem('aac_admin_config_v21', JSON.stringify(adminConfig));
    }

    // 瀏覽器原生離線語音合成
    function speakText(text) {
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW'));
      if (twVoice) utterance.voice = twVoice;
      window.speechSynthesis.speak(utterance);
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    function updateDisplayElement(displayEl) {
      if (!displayEl) return;
      if (currentInput) {
        displayEl.textContent = currentInput;
        displayEl.className = 'display-text';
      } else {
        displayEl.textContent = '（請點選下方字詞）';
        displayEl.className = 'display-text display-placeholder';
      }
      displayEl.scrollLeft = displayEl.scrollWidth;
      saveCurrentData();
    }

    function setEditMode(state) {
      isEditMode = state;
      if (isEditMode) {
        modeBadge.textContent = '✏️ 編輯模式';
        modeBadge.style.background = '#000000';
        modeBadge.style.color = '#ffffff';
      } else {
        modeBadge.textContent = '輸入模式';
        modeBadge.style.background = '#ffffff';
        modeBadge.style.color = '#000000';
      }
      renderBoard();
    }

    function renderBoard() {
      const total = getTotalPages();
      pageIndicator.textContent = `第 ${currentPage} / ${total} 頁`;
      layoutSwitchBtn.textContent = currentLayout === '5x3' ? '切換為四乘四' : '切換為九宮格';
      mainGrid.innerHTML = '';

      if (currentLayout === '6x4') {
        render6x4Layout();
      } else {
        render5x3Layout();
      }
    }

    // 渲染四乘四版面
    function render6x4Layout() {
      const container = document.createElement('div');
      container.className = 'layout-6x4';

      if (isEditMode) {
        // 編輯模式第一列：就地下拉選單（敘述文字放大 4 個字級約 24px）
        const editRow = document.createElement('div');
        editRow.className = 'col-span-3';
        editRow.style.border = '3px solid #000';
        editRow.style.borderRadius = '16px';
        editRow.style.background = '#fefce8';
        editRow.style.display = 'flex';
        editRow.style.alignItems = 'center';
        editRow.style.justifyContent = 'space-around';
        editRow.style.padding = '0 12px';

        // 頁數設定
        const pageWrap = document.createElement('div');
        pageWrap.style.display = 'flex';
        pageWrap.style.alignItems = 'center';
        pageWrap.style.gap = '8px';

        const pageLabel = document.createElement('span');
        pageLabel.textContent = '頁數:';
        pageLabel.style.fontSize = '24px';
        pageLabel.style.fontWeight = '900';

        const pageSelect = document.createElement('select');
        pageSelect.style.fontSize = '20px';
        pageSelect.style.fontWeight = 'bold';
        pageSelect.style.padding = '4px 8px';
        pageSelect.style.borderRadius = '8px';
        pageSelect.style.border = '2.5px solid #000';
        [7, 9, 11, 13, 15, 20, 25, 30].forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = `${p} 頁`;
          if (p === adminConfig.totalPages6x4) opt.selected = true;
          pageSelect.appendChild(opt);
        });

        pageWrap.appendChild(pageLabel);
        pageWrap.appendChild(pageSelect);

        // 比例設定
        const scaleWrap = document.createElement('div');
        scaleWrap.style.display = 'flex';
        scaleWrap.style.alignItems = 'center';
        scaleWrap.style.gap = '8px';

        const scaleLabel = document.createElement('span');
        scaleLabel.textContent = '比例:';
        scaleLabel.style.fontSize = '24px';
        scaleLabel.style.fontWeight = '900';

        const scaleSelect = document.createElement('select');
        scaleSelect.style.fontSize = '20px';
        scaleSelect.style.fontWeight = 'bold';
        scaleSelect.style.padding = '4px 8px';
        scaleSelect.style.borderRadius = '8px';
        scaleSelect.style.border = '2.5px solid #000';
        [
          { val: 0.85, name: '85%' },
          { val: 1.0, name: '100%' },
          { val: 1.15, name: '115%' },
          { val: 1.3, name: '130%' },
          { val: 1.45, name: '145%' }
        ].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.val;
          opt.textContent = s.name;
          if (Math.abs(s.val - adminConfig.fontScale) < 0.05) opt.selected = true;
          scaleSelect.appendChild(opt);
        });

        scaleWrap.appendChild(scaleLabel);
        scaleWrap.appendChild(scaleSelect);

        editRow.appendChild(pageWrap);
        editRow.appendChild(scaleWrap);

        // 原朗讀鍵位置改為儲存鍵
        const saveBtn = createActionBtn('💾', '儲存', () => {
          adminConfig.totalPages6x4 = parseInt(pageSelect.value, 10);
          adminConfig.fontScale = parseFloat(scaleSelect.value);
          document.documentElement.style.setProperty('--aac-font-scale', adminConfig.fontScale);
          ensurePagesCapacity();
          if (currentPage > adminConfig.totalPages6x4) currentPage = adminConfig.totalPages6x4;
          saveCurrentData();
          renderBoard();
        });
        saveBtn.style.background = '#22c55e';
        saveBtn.style.color = '#ffffff';

        container.appendChild(editRow);
        container.appendChild(saveBtn);
      } else {
        // 輸入模式原本的文字框與朗讀按鈕
        const dispArea = document.createElement('div');
        dispArea.className = 'display-box col-span-3';
        const dispText = document.createElement('div');
        dispText.id = 'displayArea';
        dispText.title = '點擊朗讀整句';
        dispText.addEventListener('click', () => { if (currentInput) speakText(currentInput); });
        dispArea.appendChild(dispText);

        const speakBtn = createActionBtn('🔊', '朗讀', () => {
          if (currentInput) speakText(currentInput);
        });
        container.appendChild(dispArea);
        container.appendChild(speakBtn);
      }

      const prevBtn = createNavBtn('◀', '上一頁');
      const delCharBtn = createActionBtn('⌫', '刪除單字', () => {
        if (currentInput.length > 0) {
          currentInput = currentInput.slice(0, -1);
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const clearBtn = createActionBtn('🗑', '刪除整句', () => {
        if (currentInput.length > 0) {
          currentInput = '';
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const nextBtn = createNavBtn('▶', '下一頁');

      container.appendChild(prevBtn);
      container.appendChild(delCharBtn);
      container.appendChild(clearBtn);
      container.appendChild(nextBtn);

      const gridItems = document.createElement('div');
      gridItems.className = 'col-span-4 row-span-4 words-grid-4x4';
      populateWordButtons(gridItems, data6x4[currentPage] || Array(16).fill(''), data6x4, false);
      container.appendChild(gridItems);

      mainGrid.appendChild(container);
      bindControlGestures(prevBtn, nextBtn);
      if (!isEditMode) updateDisplayElement(document.getElementById('displayArea'));
    }

    // 渲染九宮格版面
    function render5x3Layout() {
      const container = document.createElement('div');
      container.className = 'layout-5x3';

      if (isEditMode) {
        // 編輯模式第一列：就地下拉選單（敘述文字放大 4 個字級約 24px）
        const editRow = document.createElement('div');
        editRow.className = 'col-span-2';
        editRow.style.border = '3px solid #000';
        editRow.style.borderRadius = '16px';
        editRow.style.background = '#fefce8';
        editRow.style.display = 'flex';
        editRow.style.alignItems = 'center';
        editRow.style.justifyContent = 'space-around';
        editRow.style.padding = '0 12px';

        // 頁數設定
        const pageWrap = document.createElement('div');
        pageWrap.style.display = 'flex';
        pageWrap.style.alignItems = 'center';
        pageWrap.style.gap = '8px';

        const pageLabel = document.createElement('span');
        pageLabel.textContent = '頁數:';
        pageLabel.style.fontSize = '24px';
        pageLabel.style.fontWeight = '900';

        const pageSelect = document.createElement('select');
        pageSelect.style.fontSize = '20px';
        pageSelect.style.fontWeight = 'bold';
        pageSelect.style.padding = '4px 8px';
        pageSelect.style.borderRadius = '8px';
        pageSelect.style.border = '2.5px solid #000';
        [7, 9, 11, 13, 15, 21, 25, 31].forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = `${p} 頁`;
          if (p === adminConfig.totalPages5x3) opt.selected = true;
          pageSelect.appendChild(opt);
        });

        pageWrap.appendChild(pageLabel);
        pageWrap.appendChild(pageSelect);

        // 比例設定
        const scaleWrap = document.createElement('div');
        scaleWrap.style.display = 'flex';
        scaleWrap.style.alignItems = 'center';
        scaleWrap.style.gap = '8px';

        const scaleLabel = document.createElement('span');
        scaleLabel.textContent = '比例:';
        scaleLabel.style.fontSize = '24px';
        scaleLabel.style.fontWeight = '900';

        const scaleSelect = document.createElement('select');
        scaleSelect.style.fontSize = '20px';
        scaleSelect.style.fontWeight = 'bold';
        scaleSelect.style.padding = '4px 8px';
        scaleSelect.style.borderRadius = '8px';
        scaleSelect.style.border = '2.5px solid #000';
        [
          { val: 0.85, name: '85%' },
          { val: 1.0, name: '100%' },
          { val: 1.15, name: '115%' },
          { val: 1.3, name: '130%' },
          { val: 1.45, name: '145%' }
        ].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.val;
          opt.textContent = s.name;
          if (Math.abs(s.val - adminConfig.fontScale) < 0.05) opt.selected = true;
          scaleSelect.appendChild(opt);
        });

        scaleWrap.appendChild(scaleLabel);
        scaleWrap.appendChild(scaleSelect);

        editRow.appendChild(pageWrap);
        editRow.appendChild(scaleWrap);

        // 原朗讀鍵位置改為儲存鍵
        const saveBtn = createActionBtn('💾', '儲存', () => {
          adminConfig.totalPages5x3 = parseInt(pageSelect.value, 10);
          adminConfig.fontScale = parseFloat(scaleSelect.value);
          document.documentElement.style.setProperty('--aac-font-scale', adminConfig.fontScale);
          ensurePagesCapacity();
          if (currentPage > adminConfig.totalPages5x3) currentPage = adminConfig.totalPages5x3;
          saveCurrentData();
          renderBoard();
        });
        saveBtn.style.background = '#22c55e';
        saveBtn.style.color = '#ffffff';

        container.appendChild(editRow);
        container.appendChild(saveBtn);
      } else {
        // 輸入模式原本的文字框與朗讀按鈕
        const dispArea = document.createElement('div');
        dispArea.className = 'display-box col-span-2';
        const dispText = document.createElement('div');
        dispText.id = 'displayArea';
        dispText.title = '點擊朗讀整句';
        dispText.addEventListener('click', () => { if (currentInput) speakText(currentInput); });
        dispArea.appendChild(dispText);

        const speakBtn = createActionBtn('🔊', '朗讀', () => {
          if (currentInput) speakText(currentInput);
        });
        container.appendChild(dispArea);
        container.appendChild(speakBtn);
      }

      const prevBtn = createNavBtn('◀', '上一頁');
      const clearBtn = createActionBtn('🗑', '刪除整句', () => {
        if (currentInput.length > 0) {
          currentInput = '';
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const nextBtn = createNavBtn('▶', '下一頁');

      container.appendChild(prevBtn);
      container.appendChild(clearBtn);
      container.appendChild(nextBtn);

      const gridItems = document.createElement('div');
      gridItems.className = 'col-span-3 row-span-3 words-grid-3x3';
      populateWordButtons(gridItems, data5x3[currentPage] || Array(9).fill(''), data5x3, true);
      container.appendChild(gridItems);

      mainGrid.appendChild(container);
      bindControlGestures(prevBtn, nextBtn);
      if (!isEditMode) updateDisplayElement(document.getElementById('displayArea'));
    }

    function createActionBtn(icon, label, onClick) {
      const btn = document.createElement('button');
      btn.className = 'aac-btn';
      btn.innerHTML = `<span class="btn-icon">${icon}</span><span class="btn-label">${label}</span>`;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function createNavBtn(icon, label) {
      const btn = document.createElement('button');
      btn.className = 'aac-btn';
      btn.innerHTML = `<span class="btn-icon">${icon}</span><span class="btn-label">${label}</span>`;
      return btn;
    }

    function populateWordButtons(container, items, targetDataset, isNineGrid = false) {
      items.forEach((text, index) => {
        const btn = document.createElement('button');
        btn.className = `word-btn ${isEditMode ? 'editing' : ''}`;

        const textSpan = document.createElement('span');
        const textLen = (text || '').length;

        textSpan.className = textLen > 4 ? 'word-text-small' : 'word-text-large';
        textSpan.textContent = text || (isEditMode ? '＋' : '');
        btn.appendChild(textSpan);

        btn.addEventListener('click', () => {
          if (isEditMode) {
            const newText = prompt(`修改第 ${currentPage} 頁第 ${index + 1} 格內容：`, text);
            if (newText !== null) {
              targetDataset[currentPage][index] = newText.trim();
              saveCurrentData();
              renderBoard();
            }
          } else {
            if (text) {
              currentInput += text;
              updateDisplayElement(document.getElementById('displayArea'));
            }
          }
        });

        container.appendChild(btn);
      });
    }

    // 雙鍵手勢控制：同時按住 上一頁 + 下一頁 切換編輯模式
    function bindControlGestures(prevBtn, nextBtn) {
      let isPrevActive = false;
      let isNextActive = false;

      prevBtn.addEventListener('pointerdown', () => {
        isPrevActive = true;
        if (isNextActive) {
          setEditMode(!isEditMode);
        }
      });
      prevBtn.addEventListener('pointerup', () => {
        if (isPrevActive && !isNextActive) {
          if (currentPage > 1) { currentPage--; renderBoard(); }
        }
        isPrevActive = false;
      });
      prevBtn.addEventListener('pointerleave', () => { isPrevActive = false; });
      prevBtn.addEventListener('pointercancel', () => { isPrevActive = false; });

      nextBtn.addEventListener('pointerdown', () => {
        isNextActive = true;
        if (isPrevActive) {
          setEditMode(!isEditMode);
        }
      });
      nextBtn.addEventListener('pointerup', () => {
        const total = getTotalPages();
        if (isNextActive && !isPrevActive) {
          if (currentPage < total) { currentPage++; renderBoard(); }
        }
        isNextActive = false;
      });
      nextBtn.addEventListener('pointerleave', () => { isNextActive = false; });
      nextBtn.addEventListener('pointercancel', () => { isNextActive = false; });
    }

    layoutSwitchBtn.addEventListener('click', () => {
      currentLayout = (currentLayout === '5x3') ? '6x4' : '5x3';
      const total = getTotalPages();
      currentPage = Math.ceil(total / 2);
      saveCurrentData();
      renderBoard();
    });

    // 右上角切換編輯模式按鈕
    toggleEditBtn.addEventListener('click', () => {
      setEditMode(!isEditMode);
    });

    // 註冊 PWA 離線 Service Worker
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
      window.addEventListener('load', () => {
        try {
          const swUrl = new URL('./sw.js', window.location.href);
          if (swUrl.protocol === 'https:' || swUrl.protocol === 'http:') {
            navigator.serviceWorker.register(swUrl.href)
              .then((reg) => console.log('PWA Service Worker 註冊成功:', reg.scope))
              .catch((err) => console.warn('PWA Service Worker 註冊略過或失敗:', err));
          }
        } catch (e) {
          console.warn('非標準網頁環境，略過 Service Worker 註冊');
        }
      });
    }

    renderBoard();
  </script>
</body>
</html>
