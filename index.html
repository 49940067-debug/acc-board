<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>輔助溝通板 (AAC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-black h-screen w-screen flex flex-col p-1 sm:p-2 overflow-hidden">

  <div class="w-full h-full bg-white border-[3px] border-black rounded-2xl p-2 sm:p-3 flex flex-col gap-1.5 sm:gap-2">
    
    <!-- 頂端資訊與規格切換列 -->
    <div class="flex items-center justify-between px-1 text-sm sm:text-lg font-black flex-shrink-0">
      <div class="flex items-center gap-2">
        <div id="pageIndicator" class="px-2.5 sm:px-3 py-0.5 border-[2.5px] border-black rounded-full bg-white">
          第 5 / 9 頁
        </div>
        <!-- 規格切換按鈕（6x4 與 5x3 九宮格版） -->
        <button id="layoutSwitchBtn" class="px-2.5 sm:px-3 py-0.5 border-[2.5px] border-black rounded-full bg-black text-white hover:opacity-80 transition-all font-bold">
          切換為 5x3 版 (九宮格)
        </button>
      </div>

      <div class="flex items-center gap-2">
        <div id="modeBadge" class="px-2.5 sm:px-3 py-0.5 border-[2.5px] border-black rounded-full bg-white text-black transition-colors">
          輸入模式
        </div>
        <!-- 電腦端連點兩次切換編輯 -->
        <button id="toggleEditBtn" class="text-xs sm:text-sm underline cursor-pointer hover:opacity-70 font-bold select-none">
          連點切換編輯
        </button>
      </div>
    </div>

    <!-- 核心動態方格容器 -->
    <div id="mainGrid" class="flex-1 w-full min-h-0">
      <!-- 由 JS 動態掛載 5x3 或 6x4 -->
    </div>

    <!-- 底部操作提示 -->
    <div class="text-center text-[10px] sm:text-xs text-gray-500 font-medium flex-shrink-0">
      提示：點擊「🔊 朗讀」唸出整句｜同時按住上一頁與下一頁切換編輯模式
    </div>

  </div>

  <script>
    // 6x4 詞庫（每頁 16 格，共 9 頁）
    const DEFAULT_6X4 = {
      1: Array(16).fill(''),
      2: [
        '我想', '要', '不要', '好',
        '不好', '請幫我', '謝謝', '對不起',
        '是', '不是', '痛', '累',
        '舒服', '不舒服', '冷', '熱'
      ],
      3: [
        '要吃', '要喝', '去廁所', '要洗澡',
        '想睡覺', '要起床', '坐下', '躺下',
        '吃飽了', '口渴', '肚子餓', '吃藥',
        '要出門', '回家', '換衣服', '刷牙'
      ],
      4: [
        '頭痛', '肚子痛', '胸口痛', '腳痛',
        '手痛', '背痛', '很癢', '頭暈',
        '想吐', '抽筋', '呼吸不順', '發燒',
        '流汗', '沒力氣', '很脹', '這裡痛'
      ],
      5: Array(16).fill(''), // 第 5 頁空白常態啟動
      6: [
        '早安', '晚安', '請', '沒關係',
        '在哪裡', '什麼', '誰', '什麼時候',
        '多少', '這裡', '那裡', '現在',
        '等一下', '慢一點', '太快了', '聽不清楚'
      ],
      7: [
        '請開燈', '請關燈', '太冷了', '太熱了',
        '我想看電視', '聽音樂', '太吵了', '請小聲點',
        '請扶我', '請陪我', '不要走', '我想休息',
        '想聊聊天', '沒問題', '不知道', '再說一次'
      ],
      8: [
        '很高興', '生氣', '難過', '緊張',
        '害怕', '安心', '辛苦了', '很棒',
        '真好吃', '不喜歡', '很喜歡', '不用了',
        '我同意', '沒事的', '慢慢來', '再見'
      ],
      9: Array(16).fill('')
    };

    // 5x3 詞庫（5 列高 × 3 欄寬，下方 3x3 九宮格共 9 格詞彙）
    const DEFAULT_5X3 = {
      1: Array(9).fill(''),
      2: [
        '我想', '要', '不要',
        '好', '請幫我', '謝謝',
        '對不起', '痛', '累'
      ],
      3: [
        '要吃', '要喝', '去廁所',
        '想睡覺', '要起床', '坐下',
        '要躺下', '吃藥', '回家'
      ],
      4: [
        '這裡痛', '頭痛', '肚子痛',
        '不舒服', '很癢', '頭暈',
        '想吐', '太冷了', '太熱了'
      ],
      5: Array(9).fill(''), // 第 5 頁空白常態啟動
      6: [
        '是', '不是', '早安',
        '晚安', '請', '沒關係',
        '在哪裡', '什麼', '等一下'
      ],
      7: [
        '請開燈', '請關燈', '太吵了',
        '我想看電視', '請扶我', '我想休息',
        '不要走', '沒問題', '不知道'
      ],
      8: [
        '很高興', '辛苦了', '很棒',
        '真好吃', '很喜歡', '不用了',
        '沒事的', '慢慢來', '再見'
      ],
      9: Array(9).fill('')
    };

    const TOTAL_PAGES = 9;
    let currentLayout = localStorage.getItem('aac_layout_mode_v9') || '6x4'; // '6x4' 或 '5x3'
    let currentPage = 5;
    let isEditMode = false;

    let data6x4 = JSON.parse(localStorage.getItem('aac_data_6x4_v9')) || DEFAULT_6X4;
    let data5x3 = JSON.parse(localStorage.getItem('aac_data_5x3_v9')) || DEFAULT_5X3;
    let currentInput = localStorage.getItem('aac_current_input') || '';

    const pageIndicator = document.getElementById('pageIndicator');
    const layoutSwitchBtn = document.getElementById('layoutSwitchBtn');
    const modeBadge = document.getElementById('modeBadge');
    const toggleEditBtn = document.getElementById('toggleEditBtn');
    const mainGrid = document.getElementById('mainGrid');

    function saveCurrentData() {
      if (currentLayout === '6x4') {
        localStorage.setItem('aac_data_6x4_v9', JSON.stringify(data6x4));
      } else {
        localStorage.setItem('aac_data_5x3_v9', JSON.stringify(data5x3));
      }
      localStorage.setItem('aac_current_input', currentInput);
      localStorage.setItem('aac_layout_mode_v9', currentLayout);
    }

    function speakText(text) {
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW'));
      if (twVoice) utterance.voice = twVoice;

      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    function updateDisplayElement(displayEl) {
      if (!displayEl) return;
      displayEl.textContent = currentInput || '（請點選下方字詞）';
      displayEl.className = currentInput 
        ? "text-3xl sm:text-5xl md:text-6xl font-black tracking-wide overflow-x-auto whitespace-nowrap scrollbar-none flex-1 text-black cursor-pointer"
        : "text-3xl sm:text-5xl md:text-6xl font-black tracking-wide overflow-x-auto whitespace-nowrap scrollbar-none flex-1 text-gray-300 cursor-pointer";
      displayEl.scrollLeft = displayEl.scrollWidth;
      saveCurrentData();
    }

    function setEditMode(state) {
      isEditMode = state;
      if (isEditMode) {
        modeBadge.textContent = '✏️ 編輯模式中';
        modeBadge.className = 'px-2.5 sm:px-3 py-0.5 border-[2.5px] border-black rounded-full bg-black text-white font-black animate-bounce';
      } else {
        modeBadge.textContent = '輸入模式';
        modeBadge.className = 'px-2.5 sm:px-3 py-0.5 border-[2.5px] border-black rounded-full bg-white text-black font-black';
      }
      renderBoard();
    }

    function renderBoard() {
      pageIndicator.textContent = `第 ${currentPage} / ${TOTAL_PAGES} 頁`;
      layoutSwitchBtn.textContent = currentLayout === '6x4' ? '切換為 5x3 版' : '切換為 6x4 版';
      mainGrid.innerHTML = '';

      if (currentLayout === '6x4') {
        render6x4Layout();
      } else {
        render5x3Layout();
      }
    }

    // 渲染 6x4 版面（6 列高 × 4 欄寬）
    function render6x4Layout() {
      const container = document.createElement('div');
      container.className = 'grid grid-cols-4 grid-rows-6 gap-1.5 sm:gap-2.5 h-full w-full min-h-0';

      // 第 1 列：3 欄輸入框 + 1 欄朗讀
      const dispArea = document.createElement('div');
      dispArea.className = 'col-span-3 border-[3px] border-black rounded-2xl px-3 sm:px-5 flex items-center bg-white overflow-hidden';
      const dispText = document.createElement('div');
      dispText.id = 'displayArea';
      dispText.title = '點擊朗讀整句';
      dispText.addEventListener('click', () => { if (currentInput) speakText(currentInput); });
      dispArea.appendChild(dispText);

      const speakBtn = createActionBtn('🔊', '朗讀', () => { if (currentInput) speakText(currentInput); });

      container.appendChild(dispArea);
      container.appendChild(speakBtn);

      // 第 2 列：上一頁、刪除單字、刪除整句、下一頁
      const prevBtn = createNavBtn('◀', '上一頁');
      const delCharBtn = createActionBtn('⌫', '刪除單字', () => {
        if (currentInput.length > 0) {
          currentInput = currentInput.slice(0, -1);
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const clearBtn = createActionBtn('🗑', '刪除整句', () => {
        if (currentInput.length > 0) {
          currentInput = '';
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const nextBtn = createNavBtn('▶', '下一頁');

      container.appendChild(prevBtn);
      container.appendChild(delCharBtn);
      container.appendChild(clearBtn);
      container.appendChild(nextBtn);

      // 第 3~6 列：4 列 × 4 欄 = 16 格
      const gridItems = document.createElement('div');
      gridItems.className = 'col-span-4 row-span-4 grid grid-cols-4 grid-rows-4 gap-1.5 sm:gap-2.5 min-h-0';
      populateWordButtons(gridItems, data6x4[currentPage] || Array(16).fill(''), data6x4, false);
      container.appendChild(gridItems);

      mainGrid.appendChild(container);
      bindSimultaneousPress(prevBtn, nextBtn);
      updateDisplayElement(document.getElementById('displayArea'));
    }

    // 渲染 5x3 版面（5 列高 × 3 欄寬，下方 3x3 九宮格）
    function render5x3Layout() {
      const container = document.createElement('div');
      container.className = 'grid grid-cols-3 grid-rows-5 gap-1.5 sm:gap-2.5 h-full w-full min-h-0';

      // 第 1 列：前 2 欄文字輸入區，第 3 欄朗讀按鈕
      const dispArea = document.createElement('div');
      dispArea.className = 'col-span-2 border-[3px] border-black rounded-2xl px-3 sm:px-5 flex items-center bg-white overflow-hidden';
      const dispText = document.createElement('div');
      dispText.id = 'displayArea';
      dispText.title = '點擊朗讀整句';
      dispText.addEventListener('click', () => { if (currentInput) speakText(currentInput); });
      dispArea.appendChild(dispText);

      const speakBtn = createActionBtn('🔊', '朗讀', () => { if (currentInput) speakText(currentInput); });

      container.appendChild(dispArea);
      container.appendChild(speakBtn);

      // 第 2 列：上一頁、刪除整句（無刪除單字）、下一頁
      const prevBtn = createNavBtn('◀', '上一頁');
      const clearBtn = createActionBtn('🗑', '刪除整句', () => {
        if (currentInput.length > 0) {
          currentInput = '';
          updateDisplayElement(document.getElementById('displayArea'));
        }
      });
      const nextBtn = createNavBtn('▶', '下一頁');

      container.appendChild(prevBtn);
      container.appendChild(clearBtn);
      container.appendChild(nextBtn);

      // 第 3~5 列：3 列 × 3 欄 = 9 格（標準九宮格）
      const gridItems = document.createElement('div');
      gridItems.className = 'col-span-3 row-span-3 grid grid-cols-3 grid-rows-3 gap-1.5 sm:gap-2.5 min-h-0';
      populateWordButtons(gridItems, data5x3[currentPage] || Array(9).fill(''), data5x3, true);
      container.appendChild(gridItems);

      mainGrid.appendChild(container);
      bindSimultaneousPress(prevBtn, nextBtn);
      updateDisplayElement(document.getElementById('displayArea'));
    }

    function createActionBtn(icon, label, onClick) {
      const btn = document.createElement('button');
      btn.className = 'border-[3px] border-black rounded-2xl flex flex-col items-center justify-center font-black active:bg-black active:text-white transition-all text-2xl sm:text-4xl bg-white';
      btn.innerHTML = `<span>${icon}</span><span class="text-xs sm:text-lg font-bold mt-0.5">${label}</span>`;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function createNavBtn(icon, label) {
      const btn = document.createElement('button');
      btn.className = 'border-[3px] border-black rounded-2xl flex flex-col items-center justify-center font-black active:bg-black active:text-white transition-all text-2xl sm:text-4xl bg-white';
      btn.innerHTML = `<span>${icon}</span><span class="text-xs sm:text-lg font-bold mt-0.5">${label}</span>`;
      return btn;
    }

    function populateWordButtons(container, items, targetDataset, isNineGrid = false) {
      items.forEach((text, index) => {
        const btn = document.createElement('button');
        btn.className = `border-[3px] border-black rounded-2xl flex items-center justify-center p-1 sm:p-2 font-black transition-all active:scale-95 active:bg-black active:text-white ${
          isEditMode ? 'border-dashed bg-yellow-50' : 'bg-white'
        }`;

        const textSpan = document.createElement('span');
        const textLen = (text || '').length;

        if (isNineGrid) {
          textSpan.className = textLen > 4 
            ? 'text-lg sm:text-2xl md:text-3xl font-black leading-tight text-center break-words max-h-full overflow-hidden'
            : 'text-2xl sm:text-4xl md:text-5xl font-black leading-tight text-center break-words max-h-full overflow-hidden';
        } else {
          textSpan.className = textLen > 4 
            ? 'text-base sm:text-2xl md:text-3xl font-black leading-tight text-center break-words max-h-full overflow-hidden'
            : 'text-2xl sm:text-4xl md:text-5xl font-black leading-tight text-center break-words max-h-full overflow-hidden';
        }

        textSpan.textContent = text || (isEditMode ? '＋' : '');
        btn.appendChild(textSpan);

        btn.addEventListener('click', () => {
          if (isEditMode) {
            const newText = prompt(`修改第 ${currentPage} 頁第 ${index + 1} 格內容：`, text);
            if (newText !== null) {
              targetDataset[currentPage][index] = newText.trim();
              saveCurrentData();
              renderBoard();
            }
          } else {
            if (text) {
              currentInput += text;
              updateDisplayElement(document.getElementById('displayArea'));
            }
          }
        });

        container.appendChild(btn);
      });
    }

    function bindSimultaneousPress(prevBtn, nextBtn) {
      let prevPressed = false;
      let nextPressed = false;

      function check() {
        if (prevPressed && nextPressed) {
          setEditMode(!isEditMode);
          prevPressed = false;
          nextPressed = false;
        }
      }

      prevBtn.addEventListener('pointerdown', () => { 
        prevPressed = true; 
        check(); 
      });
      prevBtn.addEventListener('pointerup', () => {
        if (prevPressed && !nextPressed) {
          if (currentPage > 1) { 
            currentPage--; 
            renderBoard(); 
          }
        }
        prevPressed = false;
      });
      prevBtn.addEventListener('pointerleave', () => { prevPressed = false; });

      nextBtn.addEventListener('pointerdown', () => { 
        nextPressed = true; 
        check(); 
      });
      nextBtn.addEventListener('pointerup', () => {
        if (nextPressed && !prevPressed) {
          if (currentPage < TOTAL_PAGES) { 
            currentPage++; 
            renderBoard(); 
          }
        }
        nextPressed = false;
      });
      nextBtn.addEventListener('pointerleave', () => { nextPressed = false; });
    }

    layoutSwitchBtn.addEventListener('click', () => {
      currentLayout = (currentLayout === '6x4') ? '5x3' : '6x4';
      saveCurrentData();
      renderBoard();
    });

    let lastClickTime = 0;
    let clickTimeout = null;

    toggleEditBtn.addEventListener('click', () => {
      const now = new Date().getTime();
      const diff = now - lastClickTime;

      if (diff < 400 && diff > 0) {
        clearTimeout(clickTimeout);
        setEditMode(!isEditMode);
        toggleEditBtn.textContent = '連點切換編輯';
        lastClickTime = 0;
      } else {
        lastClickTime = now;
        toggleEditBtn.textContent = '再點一下切換！';
        clearTimeout(clickTimeout);
        clickTimeout = setTimeout(() => {
          toggleEditBtn.textContent = '連點切換編輯';
          lastClickTime = 0;
        }, 1200);
      }
    });

    renderBoard();
  </script>
</body>
</html>
